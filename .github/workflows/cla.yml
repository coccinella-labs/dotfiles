---
name: CLA

"on":
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  cla:
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'coccinella-labs'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Publish cla-signers from signed.json
        run: cp signed.json cla-signers.json

      - name: Checkout clabot action
        uses: actions/checkout@v6
        with:
          repository: coccinella-labs/clabot
          path: clabot

      - name: Install clabot dependencies
        run: npm ci --prefix clabot

      - name: Run CLA bot
        uses: ./clabot/
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cla-url: https://harpertoken.github.io/cla.html
